<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>For Mom & Dad ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #080814;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-size: 50px;
        }

        .photos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 40px;
        }

        .photos img {
            width: 280px;
            height: 350px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid white;
            box-shadow: 0 0 25px rgba(255,255,255,0.3);
        }
    </style>
</head>

<body>

    <h1>❤️ For My Mom & Dad ❤️</h1>

    <p>Every picture holds a beautiful memory.</p>

    <div class="photos">

        <img src="./photo1.jpg" alt="Memory 1">

        <img src="./photo2.jpg" alt="Memory 2">

        <img src="./photo3.jpg" alt="Memory 3">

        <img src="./photo4.jpg" alt="Memory 4">

        <img src="./photo5.jpg" alt="Memory 5">

    </div>

</body>
</html>
